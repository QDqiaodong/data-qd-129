[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-129"
version = "0.1.0"
description = "Bounded exact frequent itemsets and association rule metrics"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
basket-rules = "basket_rules.cli:main"
basket-rules-roll = "basket_rules.rollcli:main"
basket-rules-publish = "basket_rules.pubcli:main"
basket-rules-normalize = "basket_rules.normcli:main"
basket-rules-vouchers = "basket_rules.vouchcli:main"
[tool.setuptools.packages.find]
where = ["src"]
